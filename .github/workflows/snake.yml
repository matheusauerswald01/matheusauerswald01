name: 🐍 Gerar animação da cobrinha

on:
  # Roda 1x por dia (00:00 UTC) para manter o gráfico atualizado
  schedule:
    - cron: "0 0 * * *"
  # Permite disparar manualmente em Actions > Run workflow
  workflow_dispatch:
  # Roda também a cada push na branch principal
  push:
    branches:
      - main

# Necessário para a Action conseguir commitar o SVG na branch "output"
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-purple.svg?color_snake=%23a855f7&color_dots=%231e1b4b,%234c1d95,%237c3aed,%23a855f7,%23e879f9

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
